name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - name: Testes do gerador de .env e do compose
        run: pytest -q
      - name: O compose é válido (produção e local) e cabe no orçamento de 8 GiB?
        run: |
          python scripts/gen_env.py --email ci@example.com --output .env
          docker compose -f compose.yml config -q
          docker compose -f compose.yml -f compose.local.yml config -q
          python scripts/check_memory_budget.py
          rm .env
